name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.15.4"
  TERRAFORM_DOCS_VERSION: "0.24.0"

jobs:
  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Check Terraform formatting
      run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform validate (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
        - .
        - examples/default
        - examples/complete

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Initialize Terraform
      working-directory: ${{ matrix.working-directory }}
      run: terraform init -backend=false

    - name: Validate Terraform
      working-directory: ${{ matrix.working-directory }}
      run: terraform validate

  terraform-test:
    name: Terraform unit tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Terraform CLI
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Initialize Terraform
      run: terraform init -backend=false -test-directory=tests/unit

    - name: Run unit tests
      run: terraform test -test-directory=tests/unit

  docs:
    name: Generated docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install terraform-docs
      run: |
        curl -fsSLo terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
        tar -xzf terraform-docs.tar.gz terraform-docs
        sudo install terraform-docs /usr/local/bin/terraform-docs

    - name: Generate documentation
      run: terraform-docs -c .terraform-docs.yml .

    - name: Check generated README
      run: git diff --exit-code -- README.md
